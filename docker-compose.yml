version: '3'

networks:
  sail:
    external: true
    driver: bridge
  redis:
    external: false
    driver: bridge

services:
  node:
    container_name: goonhub-node
    hostname: goonhub-node
    restart: unless-stopped
    build: .
    working_dir: /app
    volumes:
      - .:/app:rw
      - ./servers.example.conf:/ss13_servers.conf:ro
    command: bash -c "npm install && npm run dev"
    #command: tail -F anything
    ports:
      - "4000:4000"
    depends_on:
      - redis
    networks:
      - sail
      - redis

  redis:
    container_name: goonhub-node-redis
    image: redis
    hostname: redis
    expose:
      - 6379
    networks:
      - redis
